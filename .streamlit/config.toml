[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#081018"
secondaryBackgroundColor = "#111C27"
textColor = "#E7EEF5"
font = "sans-serif"
headingFont = "sans-serif"
headingFontSizes = ["2.25rem", "1.75rem", "1.35rem"]
baseRadius = "0.75rem"
borderColor = "#233243"
dataframeBorderColor = "#233243"
dataframeHeaderBackgroundColor = "#111C27"
showWidgetBorder = true

[server]
headless = true

[browser]
gatherUsageStats = false
