name: trading-assistant

x-app-service: &app-service
  build:
    context: .
  env_file:
    - path: .env
      required: false
  environment:
    IB_HOST: ${IB_DOCKER_HOST:-ib-gateway}
    IB_PORT: ${IB_DOCKER_PORT:-4004}
  volumes:
    - ./catalog:/app/catalog
    - ./data:/app/data
    - ./reports:/app/reports

x-ib-app-service: &ib-app-service
  <<: *app-service
  depends_on:
    ib-gateway:
      condition: service_healthy
  restart: unless-stopped
  profiles: [application]

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.45.1f
    restart: always
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TZ: ${TIME_ZONE:-Etc/UTC}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:59 PM}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:${IB_PORT:-4002}:4004"
      - "127.0.0.1:5900:5900"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4002'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  trading-node:
    <<: *ib-app-service
    command: ["python", "scripts/run_live.py"]
    # 启动同步或执行边界异常时失败关闭，禁止自动重放。
    restart: "no"

  approval-bot:
    <<: *app-service
    command: ["python", "-m", "trading_assistant.notify.bot"]

  market-radar-sync:
    build:
      context: .
    # 只在操作者明确覆盖命令时采集, 不继承交易服务的完整环境与默认连接检查。
    command: ["python", "scripts/sync_market_radar.py", "--help"]
    environment:
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CATALOG_PATH: ${CATALOG_PATH:-./catalog/eodhd}
      MARKET_RADAR_DATABASE_URL: ${MARKET_RADAR_DATABASE_URL:-sqlite:///./data/market-radar.db}
      MARKET_RADAR_REPORT_ROOT: ${MARKET_RADAR_REPORT_ROOT:-./reports/market-radar}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # 目录级写权限; CLI 只写市场库, 所有共享 Catalog 写入必须串行。
    volumes:
      - ./catalog:/app/catalog
      - ./data:/app/data
      - ./reports:/app/reports
    profiles: [market-radar-sync]

  web-api:
    build:
      context: .
    command:
      - uvicorn
      - trading_assistant.web_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      BACKTEST_DATABASE_URL: ${BACKTEST_DATABASE_URL:-sqlite:///./data/backtest.db}
      CATALOG_PATH: ${CATALOG_PATH:-./catalog/eodhd}
      DATA_QUALITY_REPORT_ROOT: ${DATA_QUALITY_REPORT_ROOT:-./reports/data-quality}
      LIVE_DATABASE_URL: ${LIVE_DATABASE_URL:-sqlite:///./data/live.db}
      MARKET_RADAR_DATABASE_URL: ${MARKET_RADAR_DATABASE_URL:-sqlite:///./data/market-radar.db}
      PORTFOLIO_SNAPSHOT_STALE_SECONDS: ${PORTFOLIO_SNAPSHOT_STALE_SECONDS:-90}
      REPORT_ROOT: ${REPORT_ROOT:-./reports/backtests}
      TWS_ACCOUNT: ${TWS_ACCOUNT:-}
    volumes:
      - ./catalog:/app/catalog:ro
      - ./data:/app/data:ro
      - ./reports:/app/reports:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    profiles: [web]

  web-ui:
    build:
      context: ./web-ui
    depends_on:
      web-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles: [web]
