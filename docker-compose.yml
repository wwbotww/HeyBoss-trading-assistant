name: trading-assistant

x-app-service: &app-service
  build:
    context: .
  environment: &paper-environment
    IB_HOST: ${IB_DOCKER_HOST:-ib-gateway}
    IB_PORT: ${IB_DOCKER_PORT:-4004}
    IB_EXEC_CLIENT_ID: ${IB_EXEC_CLIENT_ID:-1202}
    TWS_ACCOUNT: ${TWS_ACCOUNT:-}
    TRADING_MODE: paper
    LIVE_DATABASE_URL: sqlite:////app/data/live.db
    CATALOG_PATH: /app/catalog/eodhd
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  volumes:
    - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/catalog:/app/catalog:ro
    - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/data:/app/data
    - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/reports:/app/reports

x-ib-app-service: &ib-app-service
  <<: *app-service
  depends_on:
    ib-gateway:
      condition: service_healthy
  restart: unless-stopped
  profiles: [application]

services:
  ib-gateway:
    image: ghcr.io/gnzsnz/ib-gateway:10.45.1f
    restart: always
    environment:
      TWS_USERID: ${TWS_USERID:-}
      TWS_PASSWORD: ${TWS_PASSWORD:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      TWS_ACCEPT_INCOMING: ${TWS_ACCEPT_INCOMING:-accept}
      TIME_ZONE: ${TIME_ZONE:-Etc/UTC}
      TZ: ${TIME_ZONE:-Etc/UTC}
      TWOFA_TIMEOUT_ACTION: ${TWOFA_TIMEOUT_ACTION:-restart}
      RELOGIN_AFTER_TWOFA_TIMEOUT: ${RELOGIN_AFTER_TWOFA_TIMEOUT:-yes}
      AUTO_RESTART_TIME: ${AUTO_RESTART_TIME:-11:59 PM}
      VNC_SERVER_PASSWORD: ${VNC_SERVER_PASSWORD:-}
    ports:
      - "127.0.0.1:${IB_PORT:-4002}:4004"
      - "127.0.0.1:5900:5900"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4002'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  trading-node:
    <<: *ib-app-service
    command: ["python", "scripts/run_live.py"]
    # 执行边界异常时失败关闭，禁止通过自动重启重放订单。
    restart: "no"

  approval-bot:
    <<: *app-service
    command: ["python", "-m", "trading_assistant.notify.bot"]
    environment:
      <<: *paper-environment
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    profiles: [manual]

  paper-data-sync:
    build:
      context: .
    command: ["python", "scripts/sync_paper_daily.py", "--serve"]
    environment:
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      CATALOG_PATH: /app/catalog/eodhd
      LIVE_DATABASE_URL: sqlite:////app/data/live.db
      DATA_QUALITY_REPORT_ROOT: /app/reports/data-quality
      FACTOR_BATCH_PATH: /app/incoming/factors
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/catalog:/app/catalog
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/data:/app/data
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/reports:/app/reports
      - ${FACDIGGER_FACTOR_BATCH_ROOT:-./runtime/incoming/factors}:/app/incoming/factors:ro
    profiles: [application]
    restart: unless-stopped

  market-radar-sync:
    build:
      context: .
    # 只在操作者明确覆盖命令时采集, 不继承交易服务的完整环境与默认连接检查。
    command: ["python", "scripts/sync_market_radar.py", "--help"]
    environment:
      EODHD_API_TOKEN: ${EODHD_API_TOKEN:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      CATALOG_PATH: /app/catalog/eodhd
      MARKET_RADAR_DATABASE_URL: sqlite:////app/data/market-radar.db
      MARKET_RADAR_REPORT_ROOT: /app/reports/market-radar
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    # 目录级写权限; CLI 只写市场库, 所有共享 Catalog 写入必须串行。
    volumes:
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/catalog:/app/catalog
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/data:/app/data
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/reports:/app/reports
    profiles: [market-radar-sync]

  web-api:
    build:
      context: .
    command:
      - uvicorn
      - trading_assistant.web_api.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      BACKTEST_DATABASE_URL: sqlite:////app/data/backtest.db
      CATALOG_PATH: /app/catalog/eodhd
      DATA_QUALITY_REPORT_ROOT: /app/reports/data-quality
      LIVE_DATABASE_URL: sqlite:////app/data/live.db
      MARKET_RADAR_DATABASE_URL: sqlite:////app/data/market-radar.db
      PORTFOLIO_SNAPSHOT_STALE_SECONDS: ${PORTFOLIO_SNAPSHOT_STALE_SECONDS:-90}
      REPORT_ROOT: /app/reports/backtests
      TWS_ACCOUNT: ${TWS_ACCOUNT:-}
    volumes:
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/catalog:/app/catalog:ro
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/data:/app/data:ro
      - ${HEYBOSS_RUNTIME_ROOT:-./runtime}/reports:/app/reports:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    profiles: [web]

  web-ui:
    build:
      context: ./web-ui
    depends_on:
      web-api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    profiles: [web]
